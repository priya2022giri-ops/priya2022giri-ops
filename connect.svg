<text x="56" y="190" class="h" font-size="96"><tspan fill="#f4f6fb">LET'S </tspan><tspan fill="url(#bt)">CONNECT.</tspan></text>
<g fill="#e0344a" transform="translate(1072 44)"><path d="M10 0h14l-10 28H0z"/><path d="M32 0h14l-10 28H22z"/><path d="M54 0h14l-10 28H44z"/></g>
<text x="1140" y="150" text-anchor="end" class="h" font-size="26" fill="#f4f6fb">GOT AN IDEA OR AN OPENING?</text>
<text x="1140" y="186" text-anchor="end" class="m" font-size="15" fill="#b9c8ee">Click a button below to reach me.</text>
