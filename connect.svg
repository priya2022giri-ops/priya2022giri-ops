<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" role="img" aria-label="Let's connect" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060a18"/><stop offset=".55" stop-color="#0b1535"/><stop offset="1" stop-color="#111c4a"/></linearGradient>
<radialGradient id="gb" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2f6fe0" stop-opacity=".55"/><stop offset="1" stop-color="#2f6fe0" stop-opacity="0"/></radialGradient>
<radialGradient id="gr" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e0344a" stop-opacity=".45"/><stop offset="1" stop-color="#e0344a" stop-opacity="0"/></radialGradient>
<linearGradient id="bt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fb0ff"/><stop offset="1" stop-color="#1f5fe0"/></linearGradient>
<pattern id="dg" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><line x1="0" y1="0" x2="0" y2="60" stroke="#7fa6ff" stroke-opacity=".07" stroke-width="2"/></pattern>
</defs>
<style>.h{font-family:Impact,Haettenschweiler,'Arial Narrow Bold','Arial Black',sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace}.s{font-family:"Segoe UI",Helvetica,Arial,sans-serif;font-weight:700}</style>
<rect width="1200" height="250" rx="18" fill="url(#bg)"/><rect width="1200" height="250" rx="18" fill="url(#dg)"/>
<circle cx="260" cy="250" r="300" fill="url(#gb)"/><circle cx="1000" cy="290" r="240" fill="url(#gr)"/>
<rect x="1.5" y="1.5" width="1197" height="247" rx="17" fill="none" stroke="#2c4da3" stroke-width="2"/>
